apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: go-simple-webserver
  labels:
    app: go-simple-webserver
spec:
  replicas: 10
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 100
  selector:
    matchLabels:
      app: go-simple-webserver
  template:
    metadata:
      labels:
        app: go-simple-webserver
    spec:
      containers:
        - name: webserver
          image: ghcr.io/florin065/go-simple-webserver@sha256:443912803c6538fae3b6e26b7eabd9f50da8b08a2ad87cabc4eaf945fb2fcb25
          ports:
            - containerPort: 8080
          imagePullPolicy: Always
